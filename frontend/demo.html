<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoDefend — Live Pipeline Demo</title>
  <meta name="description" content="Watch AutoDefend defend a chargeback in real time — every stage animated live." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    /* ── Demo page overrides ── */
    body.demo-page { background: #0b0f1c; color: #e2e8f8; font-family: "Inter", sans-serif; min-height: 100vh; }

    /* Top bar */
    .demo-topbar {
      position: sticky; top: 0; z-index: 30;
      background: rgba(11,15,28,.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.07);
      padding: 0 28px;
    }
    .demo-topbar-inner { max-width: 1280px; margin: 0 auto; height: 56px; display: flex; align-items: center; gap: 20px; }
    .demo-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: #fff; text-decoration: none; }
    .demo-brand-mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #305eff, #1e4bd8); display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff; }
    .demo-nav-links { display: flex; gap: 4px; margin-left: auto; }
    .demo-nav-links a { color: #8ea3d6; font-size: 13.5px; font-weight: 500; text-decoration: none; padding: 7px 13px; border-radius: 7px; transition: background .15s, color .15s; }
    .demo-nav-links a:hover { background: rgba(255,255,255,.07); color: #e2e8f8; }
    .demo-user-chip { display: flex; align-items: center; gap: 10px; padding-left: 16px; border-left: 1px solid rgba(255,255,255,.1); }
    .demo-user-chip .who { font-size: 13px; font-weight: 600; color: #e2e8f8; line-height: 1.2; }
    .demo-user-chip .merchant { font-size: 11px; color: #6a80b0; }
    .btn-ghost-dark { background: transparent; border: 1px solid rgba(255,255,255,.12); color: #8ea3d6; padding: 6px 13px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
    .btn-ghost-dark:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.2); color: #e2e8f8; }

    /* Main canvas */
    .demo-canvas { max-width: 1280px; margin: 0 auto; padding: 28px 28px 60px; }

    /* Hero control bar */
    .demo-hero {
      text-align: center;
      padding: 36px 0 32px;
    }
    .demo-hero h1 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; color: #fff; margin: 0 0 8px; }
    .demo-hero p { color: #8ea3d6; font-size: 15px; margin: 0 0 28px; }

    .demo-controls {
      display: flex; gap: 16px; align-items: flex-end; justify-content: center; flex-wrap: wrap;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 20px 24px;
      max-width: 700px; margin: 0 auto;
    }
    .demo-field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; }
    .demo-field label { font-size: 12px; font-weight: 600; color: #6a80b0; letter-spacing: .04em; text-transform: uppercase; }
    .demo-field select, .demo-field input {
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      border-radius: 9px; padding: 10px 14px; font-size: 14px; color: #e2e8f8;
      font-family: "Inter", sans-serif; outline: none; transition: border-color .2s;
      appearance: none;
    }
    .demo-field select:focus, .demo-field input:focus { border-color: rgba(48,94,255,.6); box-shadow: 0 0 0 3px rgba(48,94,255,.15); }
    .demo-field select option { background: #1a2340; }
    .btn-run {
      background: linear-gradient(135deg, #305eff 0%, #1e4bd8 100%);
      border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 700;
      padding: 11px 28px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(48,94,255,.4);
      transition: transform .15s, box-shadow .15s;
      display: flex; align-items: center; gap: 9px;
    }
    .btn-run:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(48,94,255,.55); }
    .btn-run:active { transform: none; }
    .btn-run:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-run .run-icon { font-size: 17px; }

    .run-status-row { display: flex; align-items: center; gap: 12px; justify-content: center; margin-top: 12px; min-height: 24px; }
    .run-status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4b5e7a; transition: background .3s; }
    .run-status-dot.active { background: #4d86ff; box-shadow: 0 0 10px rgba(77,134,255,.8); animation: pulseDot 1.5s infinite; }
    .run-status-dot.done { background: #34d399; box-shadow: 0 0 10px rgba(52,211,153,.8); animation: none; }
    .run-status-dot.error { background: #f87171; box-shadow: 0 0 10px rgba(248,113,113,.8); animation: none; }
    @keyframes pulseDot { 0%,100%{opacity:1}50%{opacity:.4} }
    #run-status { color: #6a80b0; font-size: 13px; font-weight: 500; }
    #elapsed-badge { background: rgba(48,94,255,.15); border: 1px solid rgba(48,94,255,.3); color: #7aa8ff; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; font-family: "JetBrains Mono", monospace; }

    /* Two-column workspace */
    .demo-workspace {
      display: grid; grid-template-columns: 380px 1fr; gap: 20px;
      margin-top: 20px;
    }
    @media (max-width: 880px) { .demo-workspace { grid-template-columns: 1fr; } }

    /* Left: pipeline rail */
    .pipeline-panel {
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px; padding: 22px;
    }
    .panel-title {
      font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: #4b5e7a; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
    }
    .panel-title span { width: 6px; height: 6px; border-radius: 50%; background: var(--stage-color, #4b5e7a); }

    /* Stage cards */
    .stage-list { display: flex; flex-direction: column; gap: 6px; }
    .stage-card {
      border-radius: 12px; padding: 14px 16px;
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.02);
      display: grid; grid-template-columns: 38px 1fr auto;
      align-items: start; gap: 12px;
      transition: background .25s, border-color .25s, transform .2s;
      position: relative; overflow: hidden;
    }
    .stage-card::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: transparent; border-radius: 3px; transition: background .3s;
    }
    .stage-card.running { background: rgba(48,94,255,.08); border-color: rgba(48,94,255,.25); }
    .stage-card.running::before { background: #4d86ff; }
    .stage-card.ok { background: rgba(52,211,153,.05); border-color: rgba(52,211,153,.15); }
    .stage-card.ok::before { background: #34d399; }
    .stage-card.error { background: rgba(248,113,113,.07); border-color: rgba(248,113,113,.2); }
    .stage-card.error::before { background: #f87171; }
    .stage-card.sub { padding: 10px 16px; margin-left: 20px; }
    .stage-card.sub::before { background: rgba(139,92,246,.7); }
    .stage-card.sub.running { background: rgba(139,92,246,.08); border-color: rgba(139,92,246,.2); }

    .stage-icon {
      width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
      font-size: 17px; flex-shrink: 0;
      background: rgba(255,255,255,.05); color: #6a80b0;
      transition: background .3s, color .3s;
    }
    .stage-card.running .stage-icon { background: rgba(48,94,255,.15); color: #7aa8ff; }
    .stage-card.ok .stage-icon { background: rgba(52,211,153,.12); color: #34d399; }
    .stage-card.error .stage-icon { background: rgba(248,113,113,.12); color: #f87171; }
    .stage-card.sub .stage-icon { width: 30px; height: 30px; font-size: 14px; }

    .stage-body { min-width: 0; }
    .stage-name { font-size: 14px; font-weight: 700; color: #c4d0ee; margin-bottom: 3px; transition: color .3s; }
    .stage-card.running .stage-name { color: #e2e8f8; }
    .stage-card.ok .stage-name { color: #6ee7b7; }
    .stage-detail { font-size: 12px; color: #5a7299; line-height: 1.5; transition: color .3s; }
    .stage-card.running .stage-detail { color: #8ea3d6; }

    .stage-badge { flex-shrink: 0; }
    .stage-badge span {
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
      background: rgba(255,255,255,.06); color: #4b5e7a;
      font-family: "JetBrains Mono", monospace; letter-spacing: .02em;
      display: inline-block;
    }
    .stage-card.running .stage-badge span { background: rgba(48,94,255,.2); color: #7aa8ff; }
    .stage-card.ok .stage-badge span { background: rgba(52,211,153,.15); color: #34d399; }
    .stage-card.error .stage-badge span { background: rgba(248,113,113,.15); color: #f87171; }

    /* Spinner inside running stage icon */
    .stage-card.running .stage-icon::after {
      content: ""; position: absolute; width: 38px; height: 38px; border: 2px solid transparent;
      border-top-color: rgba(77,134,255,.5); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .stage-card.sub.running .stage-icon::after { width: 30px; height: 30px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Right: live event log */
    .log-panel {
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px; display: flex; flex-direction: column;
      overflow: hidden; min-height: 420px;
    }
    .log-header {
      padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,.07);
      display: flex; align-items: center; justify-content: space-between;
    }
    .log-title { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #4b5e7a; }
    .log-count { font-size: 11px; color: #4b5e7a; background: rgba(255,255,255,.05); border-radius: 999px; padding: 2px 8px; }
    .log-body { flex: 1; overflow-y: auto; padding: 8px 0; font-family: "JetBrains Mono", monospace; font-size: 12.5px; }
    .log-body::-webkit-scrollbar { width: 4px; }
    .log-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }
    .log-entry {
      display: grid; grid-template-columns: 60px 80px 1fr;
      gap: 12px; padding: 6px 20px; align-items: baseline;
      border-bottom: 1px solid rgba(255,255,255,.03);
      opacity: 0; transform: translateY(4px);
      animation: fadeUp .25s ease forwards;
    }
    @keyframes fadeUp { to { opacity: 1; transform: none; } }
    .log-time { color: #3d5280; font-size: 11px; }
    .log-stage { font-size: 11px; font-weight: 700; letter-spacing: .02em; }
    .log-stage.classify { color: #4d86ff; }
    .log-stage.executor { color: #8b5cf6; }
    .log-stage.evaluate { color: #0ea5e9; }
    .log-stage.compile  { color: #10b981; }
    .log-stage.ingest   { color: #f59e0b; }
    .log-stage.done     { color: #34d399; }
    .log-stage.error    { color: #f87171; }
    .log-msg { color: #8ea3d6; line-height: 1.45; }
    .log-msg strong { color: #c4d0ee; }
    .log-msg .kv-pair { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.05); border-radius: 4px; padding: 1px 6px; margin: 1px 2px; }
    .log-msg .kv-k { color: #5a7299; font-size: 11px; }
    .log-msg .kv-v { color: #e2e8f8; font-size: 11px; }
    .log-msg .val-ok { color: #34d399; }
    .log-msg .val-warn { color: #fbbf24; }
    .log-msg .val-err { color: #f87171; }
    .log-empty { padding: 40px; text-align: center; color: #2d4060; font-size: 13px; }

    /* Result card */
    .result-wrap { margin-top: 20px; }
    .result-card {
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px; padding: 28px 32px;
      display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: start;
      animation: fadeUp .4s ease;
    }
    .result-card.decision-contest { border-color: rgba(52,211,153,.2); }
    .result-card.decision-accept { border-color: rgba(251,191,36,.2); }
    .result-card.decision-review { border-color: rgba(248,113,113,.2); }
    .result-title { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #4b5e7a; margin-bottom: 12px; }
    .result-decision {
      font-size: 26px; font-weight: 800; letter-spacing: -.02em;
      margin-bottom: 16px;
    }
    .result-decision.contest { color: #34d399; }
    .result-decision.recommend_accept { color: #fbbf24; }
    .result-decision.human_review { color: #f87171; }
    .result-kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px; }
    .result-kv dt { color: #4b5e7a; font-size: 13px; }
    .result-kv dd { margin: 0; color: #c4d0ee; font-size: 13px; font-weight: 600; }
    .conf-meter { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
    .conf-track { flex: 1; height: 6px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden; }
    .conf-fill { height: 100%; border-radius: 999px; transition: width 1.2s cubic-bezier(.22,.61,.36,1); }
    .conf-pct { font-size: 13px; font-weight: 700; min-width: 36px; text-align: right; }
    .result-actions { display: flex; flex-direction: column; gap: 10px; }
    .btn-dashboard {
      background: #305eff; border: none; color: #fff; padding: 11px 20px; border-radius: 9px;
      font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
      text-decoration: none; display: inline-block; text-align: center;
      transition: background .15s, transform .15s; box-shadow: 0 4px 16px rgba(48,94,255,.35);
    }
    .btn-dashboard:hover { background: #1e4bd8; transform: translateY(-1px); }
    .btn-again {
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: #8ea3d6;
      padding: 10px 20px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer;
      text-align: center; transition: background .15s;
    }
    .btn-again:hover { background: rgba(255,255,255,.1); color: #e2e8f8; }
    .keyboard-hint { font-size: 11px; color: #2d4060; text-align: center; margin-top: 6px; }
    kbd { background: rgba(255,255,255,.07); border-radius: 4px; padding: 1px 5px; font-size: 10px; font-family: "JetBrains Mono", monospace; }
  </style>
</head>
<body class="demo-page">
  <section id="demo-app" class="hidden">
    <!-- Top bar -->
    <header class="demo-topbar">
      <div class="demo-topbar-inner">
        <a class="demo-brand" href="/">
          <span class="demo-brand-mark">A</span>
          AutoDefend
        </a>
        <nav class="demo-nav-links">
          <a href="/">Home</a>
          <a href="/app">Dashboard</a>
        </nav>
        <div class="demo-user-chip">
          <div>
            <div class="who" id="me-name"></div>
            <div class="merchant" id="me-merchant"></div>
          </div>
          <button class="btn-ghost-dark" id="logout-btn">Sign out</button>
        </div>
      </div>
    </header>

    <!-- Main canvas -->
    <main class="demo-canvas">
      <!-- Hero / control bar -->
      <div class="demo-hero">
        <h1>Live Pipeline Demo</h1>
        <p>Pick a scenario — watch every agent fire in real time</p>
        <div class="demo-controls">
          <div class="demo-field">
            <label for="reason">Dispute scenario</label>
            <select id="reason">
              <option value="VISA_10_4">VISA_10_4 · Fraud – Card Absent (strong evidence)</option>
              <option value="VISA_13_1">VISA_13_1 · Merchandise Not Received</option>
              <option value="MC_4853">MC_4853 · Not as Described</option>
              <option value="UPI_RC1">UPI_RC1 · Unauthorized UPI Transaction</option>
            </select>
          </div>
          <div class="demo-field" style="max-width:160px">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" value="1250" min="10" />
          </div>
          <button class="btn-run" id="run-btn">
            <span class="run-icon">▶</span> Start live demo
          </button>
        </div>
        <div class="run-status-row">
          <div class="run-status-dot" id="status-dot"></div>
          <span id="run-status">Ready — pick a scenario and hit Start</span>
          <span id="elapsed-badge" style="display:none">0s</span>
        </div>
      </div>

      <!-- Two-column workspace -->
      <div class="demo-workspace" id="workspace" style="display:none">
        <!-- Left: pipeline stage cards -->
        <div class="pipeline-panel">
          <div class="panel-title"><span></span> Agent pipeline</div>
          <div class="stage-list" id="stage-list">
            <!-- injected by JS -->
          </div>
        </div>

        <!-- Right: live event log -->
        <div class="log-panel">
          <div class="log-header">
            <span class="log-title">Live event stream</span>
            <span class="log-count" id="log-count">0 events</span>
          </div>
          <div class="log-body" id="log-body">
            <div class="log-empty">Events will appear here as each agent fires…</div>
          </div>
        </div>
      </div>

      <!-- Result card (appended after done) -->
      <div class="result-wrap" id="result-wrap"></div>
    </main>
  </section>

  <script src="/static/demo.js"></script>
</body>
</html>
